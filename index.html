<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Wissen bleibt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ruhige Arbeitsoberfläche – helle Seitenleiste (Petrol-getönt), Inhalt in einer Spalte bis 1180px, Detailinfos in Tabs und Dialogen. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eaeef7;
  --line:#d9e0ee; --line-strong:#7d8ba8;
  --ink:#0f1c36; --ink-2:#34425f; --muted:#55627d;
  --navy:#12295a; --navy-ink:#ffffff; --navy-strong:#0b1b3d; --navy-soft:#e1e8f8;
  --magenta:#b0116f; --on-magenta:#ffffff; --magenta-strong:#8e0d5a; --magenta-soft:#fce6f2; --magenta-text:#8e0d5a;
  --ok:#1f6b3a; --ok-soft:#dff0e4; --warn:#8a5400; --warn-soft:#fbefd2; --crit:#b42318; --crit-soft:#fde7e4;
  --focus:#b0116f; --hero-bg:#12295a; --hero-ink:#ffffff;
  --nav-bg:#0e1f46; --nav-ink:#e9eefb; --nav-muted:#a9b8dc; --nav-accent:#ff7fc3;
  --glass:rgba(243,245,250,.86); --scrim:rgba(8,16,38,.5);
  --shadow:0 1px 2px rgba(15,28,54,.06),0 8px 24px rgba(15,28,54,.09); --shadow-sm:0 1px 2px rgba(15,28,54,.05),0 2px 8px rgba(15,28,54,.04);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:9px; --r-md:13px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1224; --surface:#111b35; --surface-2:#182544;
  --line:#26355b; --line-strong:#5b6d96;
  --ink:#e8edf8; --ink-2:#c2cce3; --muted:#9aa8c6;
  --navy:#9db8f5; --navy-ink:#0b1b3d; --navy-strong:#c8d8fb; --navy-soft:#1b2b55;
  --magenta:#f06cb4; --on-magenta:#3a0624; --magenta-strong:#f58cc6; --magenta-soft:#3d1630; --magenta-text:#f8a9d3;
  --ok:#74c993; --ok-soft:#163322; --warn:#e9bd62; --warn-soft:#372a10; --crit:#f29180; --crit-soft:#3e1e18;
  --focus:#f06cb4; --hero-bg:#1b3470; --hero-ink:#ffffff;
  --nav-bg:#070e22; --nav-ink:#e9eefb; --nav-muted:#9fb0d6; --nav-accent:#ff7fc3;
  --glass:rgba(10,18,36,.84); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1224; --surface:#111b35; --surface-2:#182544;
  --line:#26355b; --line-strong:#5b6d96;
  --ink:#e8edf8; --ink-2:#c2cce3; --muted:#9aa8c6;
  --navy:#9db8f5; --navy-ink:#0b1b3d; --navy-strong:#c8d8fb; --navy-soft:#1b2b55;
  --magenta:#f06cb4; --on-magenta:#3a0624; --magenta-strong:#f58cc6; --magenta-soft:#3d1630; --magenta-text:#f8a9d3;
  --ok:#74c993; --ok-soft:#163322; --warn:#e9bd62; --warn-soft:#372a10; --crit:#f29180; --crit-soft:#3e1e18;
  --focus:#f06cb4; --hero-bg:#1b3470; --hero-ink:#ffffff;
  --nav-bg:#070e22; --nav-ink:#e9eefb; --nav-muted:#9fb0d6; --nav-accent:#ff7fc3;
  --glass:rgba(10,18,36,.84); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;letter-spacing:-.012em;text-wrap:balance;margin:0;line-height:1.2;color:var(--ink)}
h1{font-size:clamp(1.7rem,1.25rem + 1.5vw,2.3rem);letter-spacing:-.022em}
p{margin:0} ul,ol{margin:0;padding-left:1.2em}
a{color:var(--navy);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--surface);padding:8px 14px;border-radius:var(--r-sm)}
.skip:focus{left:16px}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-name{font-family:var(--f-display);font-weight:650;font-size:1.22rem;line-height:1.1}
.brand-org{font-size:.78rem;color:var(--muted)}
.nav{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:transparent;border-radius:var(--r-md);cursor:pointer;text-align:left;color:var(--ink-2);font-weight:550;transition:background .15s,color .15s,box-shadow .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--navy-strong);font-weight:700;box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}.nav-btn[aria-current="page"] svg{color:var(--navy)}
.nav-btn svg{flex:none}
.nav-count{margin-left:auto;font-size:.75rem;font-weight:700;min-width:22px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.nav-btn[aria-current="page"] .nav-count{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed var(--line-strong);border-radius:var(--r-md)}
.side-foot label{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 32px}
.rolebar{display:none}
.rolebar strong{color:var(--ink)}
main{padding:32px 32px 72px;max-width:1220px;width:100%;outline:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}

@media (max-width:960px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(310px,88vw);z-index:50;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow);height:100%}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .tabbar{display:grid}
  .topbar{padding:10px 16px}
  main{padding:22px 16px 116px}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;min-height:42px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn-primary{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta);box-shadow:0 1px 2px rgba(142,13,90,.3)}
.btn-primary:hover{background:var(--magenta-strong);border-color:var(--magenta-strong);color:var(--on-magenta)}
.btn-magenta{background:var(--magenta-soft);border-color:var(--magenta);color:var(--magenta-text)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--navy)}
.btn-ghost:hover{background:var(--navy-soft)}
.btn-danger{color:var(--crit);border-color:var(--crit)}
.btn-sm{min-height:34px;padding:5px 12px;font-size:.88rem;border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn[aria-disabled="true"]{opacity:.62;border-style:dashed;cursor:not-allowed;color:var(--muted)}
.btn[aria-disabled="true"]:hover{color:var(--muted);border-color:var(--line-strong);background:var(--surface)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:var(--r-sm);cursor:pointer;display:inline-grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.linkbtn{border:0;background:none;padding:0;color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}

/* Page head */
.page-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.page-head .lead{color:var(--ink-2);max-width:62ch;margin-top:6px}
.crumbs{font-size:.86rem;margin-bottom:6px}

/* Cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-sm)}
.card-flat{background:var(--surface-2);border-radius:var(--r-md);padding:16px}
.section{display:flex;flex-direction:column;gap:14px}
.section + .section{margin-top:28px}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:1100px){.grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{color:var(--muted);font-size:.88rem}
.dl dd{margin:0;min-width:0}
@media (max-width:560px){.dl{grid-template-columns:minmax(0,1fr)}.dl dd{margin-bottom:6px}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 20px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:124px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi:hover{border-color:var(--navy);box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi-num{font-family:var(--f-display);font-size:2.2rem;line-height:1;font-weight:650;font-variant-numeric:tabular-nums}
.kpi-label{font-weight:600}
.kpi-sub{font-size:.84rem;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:6px}
.kpi.attn .kpi-num{color:var(--warn)}
.kpi.crit .kpi-num{color:var(--crit)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.chip-i{font-size:.78em;font-weight:800}
.chip-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.chip-crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.chip-info{background:var(--navy-soft);color:var(--navy-strong)}
.chip-neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.chip-demo{background:var(--magenta-soft);color:var(--magenta-text);border:1px dashed var(--magenta)}
.prio{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:800;font-size:.85rem;font-family:var(--f-display);flex:none}
.prio-A{background:var(--crit);color:var(--surface)} .prio-B{background:var(--warn-soft);color:var(--warn);border:1.5px solid var(--warn)} .prio-C{background:var(--surface);color:var(--ink-2);border:1.5px dashed var(--line-strong)}

/* Lists */
.rows{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.rows > li + li{border-top:1px solid var(--line)}
.rowbtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;width:100%;padding:16px 20px;background:none;border:0;text-align:left;cursor:pointer;transition:background .12s}
.rowbtn:hover{background:var(--surface-2)}
.row-title{font-weight:650}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--muted);margin-top:3px}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.rowbtn{grid-template-columns:auto minmax(0,1fr)}.row-side{grid-column:2;align-items:flex-start}}
.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}

/* Stepper */
.steps{display:flex;gap:3px;align-items:center}
.steps i{display:block;width:22px;height:7px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}
.stepper{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.stepper li{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:99px;border:1px solid var(--line);font-size:.84rem;color:var(--muted);background:var(--surface)}
.stepper li .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);font-size:.72rem;font-weight:700}
.stepper li.done{color:var(--ink-2)} .stepper li.done .n{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.stepper li.cur{border-color:var(--navy);color:var(--ink);font-weight:650;background:var(--navy-soft)}
.stepper li.cur .n{border-color:var(--navy);color:var(--navy-strong)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy-strong);border-bottom-color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}

/* Timeline */
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:8px 0}
.tl-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-strong);z-index:1;font-size:.8rem;font-weight:800;color:var(--muted)}
.tl-dot.done{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tl-dot.miss{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.tl-dot.end{background:var(--magenta);border-color:var(--magenta);color:var(--surface)}
.tl-dot.off{border-style:dashed}
.tl-body{min-width:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
.tl-date{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
.alert-crit{border-color:var(--crit);background:var(--crit-soft)}
.alert-warn{border-color:var(--warn);background:var(--warn-soft)}
.alert-info{border-color:var(--navy);background:var(--navy-soft)}
.alert-demo{border:1px dashed var(--magenta);background:var(--magenta-soft);color:var(--ink)}
.alert-ico{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:.85rem}
.alert-crit .alert-ico{background:var(--crit);color:var(--surface)}
.alert-warn .alert-ico{background:var(--warn);color:var(--surface)}
.alert-info .alert-ico{background:var(--navy);color:var(--navy-ink)}
.alert-demo .alert-ico{background:var(--magenta);color:var(--surface)}
.alert > div{min-width:0;flex:1}

/* Forms */
.form{display:flex;flex-direction:column;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field > label,.legend{font-weight:650;font-size:.92rem}
.hint{font-size:.83rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);min-height:40px}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:hover{border-color:var(--navy)}
.input[aria-invalid="true"]{border-color:var(--crit);border-width:2px}
.err{color:var(--crit);font-size:.85rem;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.err::before{content:"!";display:inline-grid;place-items:center;width:17px;height:17px;flex:none;border-radius:50%;background:var(--crit);color:var(--surface);font-size:.72rem;font-weight:800;margin-top:1px}
.warnmsg{color:var(--warn);font-size:.85rem;font-weight:600}
.err-sum{padding:10px 14px;border-radius:var(--r-md);background:var(--crit-soft);border:1px solid var(--crit);color:var(--ink);font-weight:600}
fieldset{border:0;padding:0;margin:0;min-width:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.choice input{margin-top:3px;accent-color:var(--navy)}
.choice-col{flex-direction:column;gap:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--navy);width:17px;height:17px}

/* Table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* Modal */
#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:var(--scrim)}
.modal-card{position:relative;background:var(--surface);border-radius:22px;width:min(760px,100%);max-height:min(88dvh,900px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);border:1px solid var(--line)}
.modal-card.wide{width:min(980px,100%)}
.modal-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px 22px;overflow:auto;display:flex;flex-direction:column;gap:18px}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:var(--r-md);box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;font-weight:500;animation:rise .2s ease both}
.toast.t-err{background:var(--crit);color:var(--surface)}
.toast b{flex:none}

/* Empty */
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-2)}
.empty h3{color:var(--ink)}

/* Flow strip */
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;counter-reset:f}
@media (max-width:1100px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.flow{grid-template-columns:minmax(0,1fr)}}
.flow button{width:100%;height:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s}
.flow button:hover{border-color:var(--navy)}
.flow .fn{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.flow .ft{font-weight:650;line-height:1.25}
.flow .done{background:var(--navy-soft);border-color:transparent}
.flow .now{border:2px solid var(--magenta)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--line);gap:1px}
.cal-h{background:var(--surface-2);padding:6px 8px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cal-d{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-d.out{background:var(--surface-2)}
.cal-d.out .cal-n{opacity:.5}
.cal-n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.cal-d.today .cal-n{display:inline-grid;place-items:center;background:var(--magenta);color:var(--surface);border-radius:99px;width:24px;height:24px;font-weight:700}
.cal-ev{border:0;text-align:left;font-size:.76rem;line-height:1.25;padding:3px 6px;border-radius:5px;background:var(--navy-soft);color:var(--navy-strong);cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.cal-ev.miss{background:var(--crit-soft);color:var(--crit)}
.cal-ev.done{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.cal-ev.end{background:var(--magenta);color:var(--surface)}


/* Tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:22px;border-left:2px solid var(--line);margin-left:12px}
.tree li{padding:4px 0}
.node{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:left;max-width:100%}
.node:hover{border-color:var(--navy)}
.node-unit{background:var(--surface-2);font-weight:700}

/* Invite */
.invite{border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden}
.invite-head{background:var(--surface-2);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.invite-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.pill-person{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy-strong);font-size:.72rem;font-weight:800;flex:none}
.avatar.lg{width:44px;height:44px;font-size:1rem}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span:first-child{font-size:.8rem;color:var(--muted)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--navy)}
.qa{border-left:0;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2)}
.check-li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.check-li.isdone .ci-text{text-decoration:line-through;color:var(--muted)}
.ci-text{font-weight:600}
.divider{height:1px;background:var(--line);margin:4px 0}
.suggest{border:1px dashed var(--navy);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

/* ===== Modern layer ===== */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#main.enter{animation:rise .24s ease both}
.menu-btn{display:none}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer;text-align:left;min-width:0;box-shadow:var(--shadow-sm)}
.search:hover{border-color:var(--navy);color:var(--ink)}
.search-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2)}

}

.nav-grp:first-child{padding-top:0}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

details>summary{cursor:pointer;font-weight:650;color:var(--navy-strong)}
.pal-wrap{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:min(14vh,120px) 16px 16px}
.pal-back{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pal{position:relative;width:min(640px,100%);max-height:min(70dvh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden;animation:rise .18s ease both}

#pal-list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}

@media (max-width:640px){
  #modal{place-items:end center;padding:0}

function miniCal() {

  for (let i = 0; i < 42; i++) { cells.push(d); d = D.add(d, 1); }
  const last = cells.findLastIndex(c => c.slice(0, 7) === m), rows = Math.ceil((last + 1) / 7) * 7;
  return `<div class="mini" role="group" aria-label="Kalender ${MON[mo - 1]} ${y}"><p class="mini-h">${MON[mo - 1]} ${y}</p><div class="mini-g">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(x => `<span class="mini-w">${x}</span>`).join('')}${cells.slice(0, rows).map(c => {
    const de = S.events.filter(e => e.date === c && e.status !== 'abgesagt'), n = de.length;

}

function generateOnboarding(c) {
  const dec = S.decisions[c.id] || {};
  const ts = caseTasks(c.id);
  const keep = ts.filter(t => dec[t.id] && dec[t.id].choice !== 'einstellen');
  const n = (() => { let i = 0; return () => 'i' + (++i); })();
  const kbs = uniq(['kb-r1'].concat(keep.map(t => t.kbId))).filter(id => kbE(id));
  const systems = uniq(keep.flatMap(t => t.kbId && kbE(t.kbId) ? kbE(t.kbId).systems : []));
  const contacts = uniq(keep.flatMap(t => t.kbId && kbE(t.kbId) ? kbE(t.kbId).contacts : []));
  const docs = uniq(keep.flatMap(t => t.kbId && kbE(t.kbId) ? kbE(t.kbId).docs : []).map(d => d.split(' › ').slice(0, 3).join(' › ')));
  const w = S.wizard[c.id];
  const items = {
    tag1: [
      { id: n(), t: `Rolle verstehen: ${c.roleTitle} im Team Learning & Development`, sub: 'Zweck, Verantwortungen und Vertretungsregeln', kb: 'kb-r1' },
      { id: n(), t: `Kennenlernen: ${pn(c.managerId)} (Führungskraft)` + (c.interimId ? ` und ${pn(c.interimId)} (bisherige Vertretung)` : ''), sub: 'Erwartungen an die ersten 30 Tage klären' },
      { id: n(), t: 'Zugriffe prüfen', sub: systems.join(' · ') },
      { id: n(), t: 'Ablagen kennenlernen', sub: docs.join(' · ') + ' (Beispielablagen, nicht angebunden)' },
      { id: n(), t: 'Prioritäten: ' + keep.filter(t => t.prio === 'A').map(t => t.title).join(' · '), sub: 'Kritische Aufgaben zuerst' }
    ],
    woche1: keep.filter(t => t.kind !== 'projekt').map(t => ({ id: n(), t: `Kernaufgabe kennenlernen: ${t.title}`, sub: `Priorität ${t.prio}${dec[t.id].choice === 'verbessern' ? ' · Verbessern: ' + dec[t.id].note : ''}`, kb: t.kbId }))
      .concat(keep.filter(t => t.kind === 'projekt').map(t => ({ id: n(), t: `Projekt: ${t.title}`, sub: 'Steckbrief, Meilensteine und offene Entscheidungen durchgehen', kb: t.kbId })))
      .concat(contacts.slice(0, 6).map(x => ({ id: n(), t: `Kennenlerngespräch: ${x}` }))),
    monat1: keep.filter(t => t.prio !== 'C').map(t => ({ id: n(), t: `Praktische Übernahme: ${t.practice || t.title}`, sub: `Selbstständig durchführen und in der Übernahmeprüfung dokumentieren`, kb: t.kbId }))
      .concat([{ id: n(), t: `Feedbackgespräch mit ${pn(c.managerId)} nach 30 Tagen (${D.fmt(D.prevWork(D.add(c.successorStart || c.lastDay, 30)))})`, sub: 'Was läuft, was fehlt, welche Wissenseinträge brauchen Verbesserung?' }]),
    weiter: S.gaps.filter(g => g.caseId === c.id && g.state === 'offen' && (!g.taskId || keep.some(t => t.id === g.taskId))).map(g => ({ id: n(), t: 'Offenes Lernfeld: ' + g.desc, sub: `Kritikalität ${g.crit} · Lösung bis ${D.fmt(g.due)} durch ${pn(g.ownerId)}` }))
      .concat(keep.filter(t => t.prio === 'C').map(t => ({ id: n(), t: `Vertiefung: ${t.title}`, sub: t.practice || '', kb: t.kbId })))
      .concat(keep.filter(t => dec[t.id].choice === 'verbessern').map(t => ({ id: n(), t: `Verbesserung umsetzen: ${t.title}`, sub: dec[t.id].note })))
      .concat(S.commitments.filter(x => x.caseId === c.id && x.confirmed).map(x => ({ id: n(), t: 'Übernommene Verpflichtung: ' + x.text, sub: 'Von der Führungskraft bestätigt' })))
  };
  (S.suggestions || []).filter(x => x.caseId === c.id && x.kind === 'onb' && x.state === 'bestätigt').forEach(x => items.tag1.push({ id: n(), t: 'Tipp deiner Vorgängerin (bestätigt)', sub: x.text }));
  keep.filter(t => !isVerified(t)).forEach(t => items.weiter.unshift({ id: n(), t: `Offene Lernaufgabe (Inhalt nicht verifiziert): ${t.title}`, sub: 'Dokumentation als Entwurf lesen und mit der einweisenden Person abgleichen', kb: t.kbId }));
  const excluded = ts.filter(t => dec[t.id] && dec[t.id].choice === 'einstellen').map(t => `Eingestellt: ${t.title}`).concat(['Persönliche Leistungsbewertungen, Gehaltsangaben und die Zielvereinbarung der Vorgängerin als Ganzes', ...S.commitments.filter(x => x.caseId === c.id && !x.confirmed).map(x => 'Nicht bestätigte Verpflichtung (nicht übernommen): ' + x.text.slice(0, 80))]);
  const prev = S.onboardings.find(o => o.caseId === c.id);
  const start = c.successorStart || D.add(c.lastDay, 1);
  const ob = { id: prev ? prev.id : 'ob-' + c.successorId, personId: c.successorId, caseId: c.id, roleTitle: c.roleTitle, start, generatedAt: TODAY, items, done: {}, kbIds: kbs, excluded, plan: buildLearnPlan(c, keep, dec, start) };
  S.onboardings = S.onboardings.filter(o => o.caseId !== c.id).concat([ob]);
  return ob;
}

function specialPlan(c, sf) {

  const m = $('#modal');

  if (ev.key === 'Tab' && !m.hidden) {
    const fs = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', m).filter(x => !x.disabled && x.offsetParent !== null);
    if (!fs.length) return; const first = fs[0], last = fs[fs.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
  const tl = ev.target.closest && ev.target.closest('[role="tablist"]');
  if (tl && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const tabs = $$('[role="tab"]', tl); const i = tabs.indexOf(ev.target); if (i < 0) return;
    const n = tabs[(i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];

const regStrip = o => { const r = Object.assign({}, o); delete r.id; return r; };

  });

  batch.push(regDb.doc('auswertung/auswertung-' + c.id).set({
    person: pn(c.personId), stelleId: sid, datum: c.lastDay, dauer: Math.max(0, D.diff(c.lastDay, c.created)),

}

function regLocalDb() {

  const subs = {}, persist = () => { try { localStorage.setItem(REG_LK, JSON.stringify(st)); } catch (e) { /* ohne Speicherung weiter */ } };
  const snap = c => ({ docs: Object.entries(st[c] || {}).map(([id, d]) => ({ id, data: () => d })) });
  const notify = c => (subs[c] || []).forEach(f => f(snap(c)));

      set: async d => { (st[c] = st[c] || {})[id] = JSON.parse(JSON.stringify(d)); persist(); notify(c); },
      delete: async () => { if (st[c]) delete st[c][id]; persist(); notify(c); } }; },
    onSnapshot: f => { (subs[c] = subs[c] || []).push(f); setTimeout(() => f(snap(c)), 0); return () => { }; }
  });
  regReset = () => { st = regSeedLocal(); persist(); ['stellen', 'projekte', 'auswertung'].forEach(notify); };

    try {
      const r = await cmt.openComposer(target);
      $('#cm-hint').textContent = r.opened ? 'Schreibe deine Anmerkung. Bearbeitende können sie direkt an Claude senden.' : 'Es ist schon ein Kommentar offen. Schließe ihn zuerst.';
    } catch (e) { $('#cm-hint').textContent = e && e.code === 'rate_limited' ? 'Bitte einen Moment warten.' : 'Kommentieren ist in dieser Ansicht nicht möglich.'; }
  }, true);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && cmOn) cmSet(false); });
}
load();
render();
regInit();
cmInit();
</script>
</body>
</html>
